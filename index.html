<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Drum Smash — a gentle, colourful tap and keyboard drum toy for toddlers and little drummers.">
  <title>Drum Smash</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff6e52'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23fff4d6'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23ffd35c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game">
    <button class="parent" type="button" id="parent" aria-label="Parent controls (hold for 1.5 seconds)">
      <span class="parent-ring" aria-hidden="true"></span>
    </button>

    <div class="sky-decor" aria-hidden="true">
      <svg class="cloud cloud-1" viewBox="0 0 180 76">
        <path d="M32 68h118a22 22 0 0 0 4-43.6A32 32 0 0 0 92 14a28 28 0 0 0-52 12A22 22 0 0 0 32 68z"/>
      </svg>
      <svg class="cloud cloud-2" viewBox="0 0 180 76">
        <path d="M32 68h118a22 22 0 0 0 4-43.6A32 32 0 0 0 92 14a28 28 0 0 0-52 12A22 22 0 0 0 32 68z"/>
      </svg>
      <svg class="cloud cloud-3" viewBox="0 0 180 76">
        <path d="M32 68h118a22 22 0 0 0 4-43.6A32 32 0 0 0 92 14a28 28 0 0 0-52 12A22 22 0 0 0 32 68z"/>
      </svg>
    </div>

    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="10" fill="#fff5d6"/>
            <circle cx="16" cy="16" r="4.5" fill="#ffd154"/>
          </svg>
        </span>
        Drum <b>Smash</b>
      </div>
      <div class="header-pills">
        <span class="mute-badge" aria-live="polite">🔇 Muted</span>
        <div class="count-pill"><strong id="count">0</strong> smashes</div>
      </div>
    </header>

    <div class="center-wrap">
      <section class="hero" aria-live="polite">
        <p class="eyebrow" id="mode-name">DRUM PARTY</p>
        <h1 id="heading">Tap, tap, boom!</h1>
        <p class="instruction" id="instruction">Tap a drum or press any key. Hold for a drum roll!</p>
      </section>

      <div class="stage" aria-label="Interactive toy drum kit">
        <svg class="drum-kit" viewBox="0 0 640 270" role="img" aria-label="Toy drum kit with hi-hat, snare, bass kick drum, floor tom, and crash cymbal">
          <!-- Soft stage rug shadow -->
          <ellipse cx="320" cy="244" rx="268" ry="20" fill="rgba(32, 73, 117, 0.11)"/>

          <!-- Hi-Hat (Left) -->
          <g class="drum-piece" data-drum="hat">
            <line x1="88" y1="88" x2="88" y2="236" stroke="#597a96" stroke-width="8" stroke-linecap="round"/>
            <path d="M88 214l-26 24M88 214l26 24" stroke="#597a96" stroke-width="7" stroke-linecap="round"/>
            <ellipse cx="88" cy="100" rx="52" ry="13" fill="#e6a82e" stroke="#be7c18" stroke-width="5"/>
            <ellipse cx="88" cy="88" rx="52" ry="13" fill="#ffda63" stroke="#be7c18" stroke-width="5"/>
            <ellipse cx="88" cy="83" rx="14" ry="5.5" fill="#fff1a6"/>
          </g>

          <!-- Crash / Bell Cymbal (Right) -->
          <g class="drum-piece" data-drum="ding">
            <line x1="552" y1="74" x2="552" y2="236" stroke="#597a96" stroke-width="8" stroke-linecap="round"/>
            <path d="M552 214l-26 24M552 214l26 24" stroke="#597a96" stroke-width="7" stroke-linecap="round"/>
            <g transform="rotate(8 552 74)">
              <ellipse cx="552" cy="74" rx="60" ry="15" fill="#ffd452" stroke="#c8861e" stroke-width="5"/>
              <path d="M532 69c4-14 36-14 40 0" fill="#ffb845" stroke="#c8861e" stroke-width="4.5"/>
              <ellipse cx="552" cy="63" rx="7" ry="3.5" fill="#fff2b0"/>
            </g>
          </g>

          <!-- Snare Drum (Mid-Left) -->
          <g class="drum-piece" data-drum="snare">
            <path d="M188 184v52M188 218l-24 20M188 218l24 20" stroke="#597a96" stroke-width="7" stroke-linecap="round"/>
            <rect x="132" y="132" width="112" height="54" rx="16" fill="#5ec2b3" stroke="#2c6f7e" stroke-width="6"/>
            <ellipse cx="188" cy="134" rx="56" ry="16" fill="#fff7e2" stroke="#2c6f7e" stroke-width="5.5"/>
            <line x1="156" y1="150" x2="156" y2="178" stroke="#e4fbf6" stroke-width="5" stroke-linecap="round"/>
            <line x1="188" y1="152" x2="188" y2="180" stroke="#e4fbf6" stroke-width="5" stroke-linecap="round"/>
            <line x1="220" y1="150" x2="220" y2="178" stroke="#e4fbf6" stroke-width="5" stroke-linecap="round"/>
          </g>

          <!-- Floor Tom (Mid-Right) -->
          <g class="drum-piece" data-drum="tom">
            <path d="M412 186l-10 50M492 186l10 50" stroke="#597a96" stroke-width="7" stroke-linecap="round"/>
            <path d="M398 124h108v64c0 14-24 24-54 24s-54-10-54-24v-64z" fill="#ff9852" stroke="#c95a33" stroke-width="6"/>
            <ellipse cx="452" cy="124" rx="54" ry="16" fill="#fff5d9" stroke="#c95a33" stroke-width="5.5"/>
            <circle cx="424" cy="166" r="6" fill="#ffd98a"/>
            <circle cx="452" cy="172" r="6" fill="#ffd98a"/>
            <circle cx="480" cy="166" r="6" fill="#ffd98a"/>
          </g>

          <!-- Bass Kick Drum (Center Hero) -->
          <g class="drum-piece" data-drum="kick">
            <path d="M258 214l-18 24M382 214l18 24" stroke="#4c6f8e" stroke-width="9" stroke-linecap="round"/>
            <circle cx="320" cy="154" r="82" fill="#ff7357" stroke="#c94732" stroke-width="8"/>
            <circle cx="320" cy="154" r="63" fill="#fff5db" stroke="#f2c15a" stroke-width="7"/>
            <circle cx="320" cy="154" r="24" fill="#ffd463"/>
            <circle cx="320" cy="154" r="10" fill="#ff8462"/>
            <!-- Toy drum decorative lugs -->
            <circle cx="320" cy="81" r="5.5" fill="#ffe79e"/>
            <circle cx="320" cy="227" r="5.5" fill="#ffe79e"/>
            <circle cx="247" cy="154" r="5.5" fill="#ffe79e"/>
            <circle cx="393" cy="154" r="5.5" fill="#ffe79e"/>
          </g>
        </svg>
      </div>

      <div class="numbers-stage" aria-label="Counting number pads">
        <button class="toy-pad" type="button" data-num="1" aria-label="Number 1">
          1<span class="pad-dots" aria-hidden="true"><i></i></span>
        </button>
        <button class="toy-pad" type="button" data-num="2" aria-label="Number 2">
          2<span class="pad-dots" aria-hidden="true"><i></i><i></i></span>
        </button>
        <button class="toy-pad" type="button" data-num="3" aria-label="Number 3">
          3<span class="pad-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <button class="toy-pad" type="button" data-num="4" aria-label="Number 4">
          4<span class="pad-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>
        <button class="toy-pad" type="button" data-num="5" aria-label="Number 5">
          5<span class="pad-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </button>
      </div>

      <div class="sound" id="sound" aria-live="polite">Ready to play!</div>
    </div>

    <div class="horizon" aria-hidden="true">
      <svg class="skyline-svg" viewBox="0 0 1200 110" preserveAspectRatio="none">
        <!-- Soft distant hills -->
        <path d="M0 110 Q180 42 380 86 T780 78 T1200 72 L1200 110 Z" fill="rgba(120, 196, 166, 0.32)"/>
        <!-- Subtle London silhouette: Big Ben, London Eye, cosy terraces -->
        <g fill="rgba(96, 152, 166, 0.22)">
          <!-- Left cosy terrace houses -->
          <rect x="70" y="64" width="38" height="46" rx="4"/>
          <polygon points="66,66 89,44 112,66"/>
          <rect x="114" y="72" width="34" height="38" rx="4"/>
          <polygon points="110,74 131,56 152,74"/>
          <!-- Big Ben clock tower -->
          <rect x="210" y="34" width="28" height="76" rx="2"/>
          <polygon points="208,34 224,8 240,34"/>
          <circle cx="224" cy="48" r="7" fill="rgba(255, 249, 235, 0.7)"/>
          <!-- London Eye wheel -->
          <circle cx="968" cy="64" r="34" fill="none" stroke="rgba(96, 152, 166, 0.24)" stroke-width="4.5"/>
          <circle cx="968" cy="64" r="6"/>
          <path d="M968 64l-16 46M968 64l16 46" stroke="rgba(96, 152, 166, 0.24)" stroke-width="4"/>
          <!-- Right cottages -->
          <rect x="1058" y="68" width="40" height="42" rx="4"/>
          <polygon points="1054,70 1078,48 1102,70"/>
        </g>
        <!-- Tiny pastel red London bus -->
        <g transform="translate(838, 66)">
          <rect x="0" y="6" width="54" height="28" rx="7" fill="#f07260" opacity="0.72"/>
          <rect x="6" y="11" width="11" height="8" rx="2" fill="#fff8e8" opacity="0.9"/>
          <rect x="21" y="11" width="11" height="8" rx="2" fill="#fff8e8" opacity="0.9"/>
          <rect x="36" y="11" width="11" height="8" rx="2" fill="#fff8e8" opacity="0.9"/>
          <circle cx="13" cy="35" r="5" fill="#3a5d7c" opacity="0.75"/>
          <circle cx="41" cy="35" r="5" fill="#3a5d7c" opacity="0.75"/>
        </g>
      </svg>
      <div class="ground">
        <span>London town</span>
        <span>tap tap tap</span>
        <span>little drummer</span>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
