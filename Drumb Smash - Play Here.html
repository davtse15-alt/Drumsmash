<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drum Smash</title>
  <style>
    :root { --blue:#245892; --coral:#ff775b; --cream:#fff8e6; }
    * { box-sizing:border-box } html,body { margin:0; min-height:100%; overflow:hidden; font-family:Arial,Helvetica,sans-serif; color:var(--blue) }
    body { background:radial-gradient(circle at 12% 18%,#ffdd78 0 5%,transparent 5.4%),radial-gradient(circle at 88% 24%,#b8e7ef 0 8%,transparent 8.4%),linear-gradient(145deg,#fff7df,#f7fbeb) }
    main { min-height:100vh; min-height:100svh; position:relative; overflow:hidden; touch-action:none; user-select:none }
    header { padding:24px clamp(22px,5vw,70px); display:flex; justify-content:space-between; align-items:center; position:relative;z-index:2 }
    .brand {font-size:clamp(24px,3vw,38px);font-weight:800;letter-spacing:-1.7px}.brand b{color:var(--coral)}.dot{display:inline-grid;place-items:center;width:.83em;height:.83em;border-radius:50%;margin-right:5px;font-size:.63em;vertical-align:middle;background:#ff795b;color:#ffd55d;box-shadow:0 4px 0 #c95542}.count{background:#ffffffbf;padding:9px 14px;border-radius:99px;font-weight:700;color:#50729a;font-size:14px}
    .hero {max-width:850px;margin:2vh auto 0;padding:0 20px;text-align:center;position:relative;z-index:1}.london{display:flex;justify-content:center;gap:24px;font-size:clamp(20px,3vw,32px);margin-bottom:14px}.london span{animation:bob 3s ease-in-out infinite}.london span:nth-child(even){animation-delay:-.9s}.eyebrow{color:#f36e52;letter-spacing:2px;font-weight:800;font-size:12px;margin:0 0 10px}.hero h1{font-size:clamp(47px,8vw,100px);letter-spacing:-5px;line-height:.92;margin:0}.instruction{font-size:clamp(18px,2.4vw,26px);font-weight:700;margin:17px 0 10px;color:#527298}
    .stage{height:18px;position:relative;margin:6px auto 0;width:min(600px,94vw)}.instrument-burst{width:clamp(70px,10vw,100px);height:auto;filter:drop-shadow(0 5px 3px #2458922b)}.sound{display:inline-block;background:#ffffffa6;font-weight:800;border-radius:99px;padding:8px 18px;margin-top:-4px;min-width:110px}
    .ground{position:absolute;bottom:0;height:min(14vh,115px);left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:#78c1b4;color:#e4f6df;font-size:clamp(12px,2vw,17px);font-weight:800;transform:rotate(-1deg) scale(1.03)}.ground span:nth-child(2){color:#ffe17f}.ground span:nth-child(3){color:#ffded5}.burst{position:fixed;z-index:4;pointer-events:none;translate:-50% -50%;font-size:clamp(75px,10vw,100px);line-height:1;animation:float 1.25s ease-out forwards}.burst.drum-kick{width:82px;height:82px;border-radius:50%;background:#ffbd65;border:9px solid #e95f51;box-shadow:inset 0 0 0 7px #ffd986,0 5px 0 #23517b1f}.burst.drum-kick:after{content:'';position:absolute;inset:25px;border-radius:50%;background:#f8e9b8}.burst.drum-snare{width:84px;height:44px;border:7px solid #477fa3;border-radius:12px 12px 20px 20px;background:#aee3df;box-shadow:inset 0 8px #e7fcf3,0 6px 0 #245892}.burst.drum-snare:before,.burst.drum-snare:after{content:'';position:absolute;top:42px;width:7px;height:24px;background:#477fa3}.burst.drum-snare:before{left:15px}.burst.drum-snare:after{right:15px}.burst.drum-hat{width:100px;height:25px;border-radius:50%;background:#ffd15d;border:6px solid #e49c39;box-shadow:0 28px 0 -10px #ffd15d}.burst.drum-hat:after{content:'';position:absolute;width:6px;height:65px;background:#637e95;left:42px;top:22px;z-index:-1}.burst.drum-tom{width:78px;height:58px;border-radius:48% 48% 42% 42%;background:#ff9068;border:8px solid #e95f51;box-shadow:inset 0 10px #ffd19e,0 8px 0 #c45a4a}.burst.drum-ding{width:92px;height:18px;border-radius:50%;background:#ffd15d;border:5px solid #e49c39}.burst.drum-ding:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#ffbd65;border:4px solid #e49c39;left:31px;top:-9px}.burst.drum-ding:after{content:'';position:absolute;width:5px;height:59px;background:#637e95;left:39px;top:16px;z-index:-1}
    .parent{position:fixed;z-index:8;top:0;left:0;width:52px;height:52px;border:0;background:transparent}.panel{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(610px,calc(100vw - 32px));padding:28px;border-radius:28px;background:#fffdf6;box-shadow:0 20px 60px #1f426640;text-align:left}.panel h2{margin:0;font-size:28px;letter-spacing:-1px}.close{position:absolute;right:20px;top:20px;border:0;background:#e9f2f2;border-radius:50%;font-size:27px;width:39px;height:39px;color:var(--blue)}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.modes button{border:3px solid #e7edf1;background:#fff;padding:18px 12px;border-radius:20px;color:var(--blue);font-size:34px}.modes button.active{border-color:#ff9b67}.modes span,.modes small{display:block}.modes span{font-size:17px;font-weight:800;margin-top:7px}.modes small{color:#7187a1;font-size:12px;margin-top:2px}.parent-note{margin:20px 0 0;text-align:center;color:#587693;font-size:13px;font-weight:700}
    .numbers .stage{display:none}.numbers h1{color:#7b63b5}.numbers .instruction{color:#776b99}@keyframes float{from{opacity:0;translate:-50% -20%}20%{opacity:1}to{opacity:0;translate:-50% -155%}}@keyframes bob{50%{transform:translateY(-5px) rotate(3deg)}}@media(max-width:600px){header{padding:18px 20px}.brand{font-size:27px}.count{font-size:12px;padding:7px 10px}.hero{margin-top:3vh}.stage{height:18px}.ground{height:70px}.ground span{font-size:11px}.panel{padding:23px}.modes{gap:9px}.modes button{padding:13px 5px}}
  </style>
</head>
<body>
  <main id="game">
    <button class="parent" aria-label="Parent controls" id="parent"></button>
    <header><div class="brand"><span class="dot">●</span>Drum <b>Smash</b></div><div class="count"><span id="count">0</span> smashes</div></header>
    <section class="hero" aria-live="polite"><p class="eyebrow" id="mode-name">DRUM PARTY</p><h1 id="heading">Tap, tap, boom!</h1><p class="instruction" id="instruction">Press anything. Hold it for a drum roll!</p><div class="stage"></div><div class="sound" id="sound">Ready to play!</div></section>
    <div class="ground"><span>London town</span><span>tap tap tap</span><span>little drummer</span></div>
  </main>
  <script>
    const game=document.querySelector('#game'),count=document.querySelector('#count'),sound=document.querySelector('#sound'),parent=document.querySelector('#parent');let mode='drums',total=0,ctx,delay,roll,parentHold;const drums=[['Boom','',86,'kick'],['Tap','',182,'snare'],['Tss','',480,'hat'],['Tom','',138,'tom'],['Ding','',650,'ding']],instruments=['assets/toy-drum-v2.png','assets/snare.png'],drumEmojis=['🥁','🎵','✨','⭐','🎶','🎺','🔴','🟡','🔵','🟢'],icons=['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','🐶','🚕','🚌','🎈','🌈','⭐','🎵'];
    function noise(seconds){let b=ctx.createBuffer(1,ctx.sampleRate*seconds,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}function play(d){ctx??=new AudioContext();if(ctx.state==='suspended')ctx.resume();let n=ctx.currentTime,g=ctx.createGain();g.connect(ctx.destination);g.gain.setValueAtTime(.0001,n);if(d[3]==='kick'||d[3]==='tom'){let o=ctx.createOscillator();o.type=d[3]==='kick'?'sine':'triangle';o.frequency.setValueAtTime(d[2]*2.8,n);o.frequency.exponentialRampToValueAtTime(d[2]*.65,n+.17);g.gain.exponentialRampToValueAtTime(.22,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+.32);o.connect(g);o.start(n);o.stop(n+.34);return}let s=ctx.createBufferSource(),f=ctx.createBiquadFilter();s.buffer=noise(d[3]==='hat'?.09:.24);f.type=d[3]==='hat'?'highpass':d[3]==='ding'?'bandpass':'bandpass';f.frequency.value=d[3]==='hat'?6500:d[3]==='ding'?3600:1800;f.Q.value=d[3]==='ding'?1.5:.7;s.connect(f);f.connect(g);g.gain.exponentialRampToValueAtTime(d[3]==='hat'?.06:.13,n+.005);g.gain.exponentialRampToValueAtTime(.0001,n+(d[3]==='hat'?.09:.22));s.start(n);s.stop(n+.25);if(d[3]==='ding'){let o=ctx.createOscillator();o.type='sine';o.frequency.value=620;o.connect(g);o.start(n);o.stop(n+.18)}}
    function smash(x=innerWidth/2,y=innerHeight/2){let item,drumMode=mode==='drums';if(drumMode){item=drums[Math.floor(Math.random()*drums.length)];play(item);sound.textContent=item[0]}else{item=['Ta-da!',icons[Math.floor(Math.random()*icons.length)]];sound.textContent=item[0]}let showInstrument=drumMode&&Math.random()<.35,b=showInstrument?document.createElement('img'):document.createElement('span');b.className='burst'+(showInstrument?' instrument-burst':'');if(showInstrument){b.src=instruments[Math.floor(Math.random()*instruments.length)];b.alt=''}else b.textContent=drumMode?drumEmojis[Math.floor(Math.random()*drumEmojis.length)]:item[1];b.style.left=x+'px';b.style.top=y+'px';game.append(b);setTimeout(()=>b.remove(),1250);count.textContent=++total}
    function stop(){clearTimeout(delay);clearInterval(roll)}function begin(x,y){smash(x,y);stop();delay=setTimeout(()=>roll=setInterval(()=>smash(x+(Math.random()-.5)*70,y+(Math.random()-.5)*45),130),330)}
    game.addEventListener('pointerdown',e=>{if(e.target===parent)return;game.setPointerCapture?.(e.pointerId);begin(e.clientX,e.clientY)});game.addEventListener('pointerup',stop);game.addEventListener('pointercancel',stop);addEventListener('contextmenu',e=>e.preventDefault());addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();return}if(!e.repeat&&!['Meta','Control','Alt','Shift'].includes(e.key)){e.preventDefault();begin(innerWidth*(.1+Math.random()*.8),innerHeight*(.15+Math.random()*.65))}});addEventListener('keyup',stop);addEventListener('blur',stop);
    parent.addEventListener('pointerdown',e=>{e.stopPropagation();parentHold=setTimeout(openPanel,1600)});parent.addEventListener('pointerup',()=>clearTimeout(parentHold));function openPanel(){let p=document.createElement('div');p.className='panel';p.innerHTML='<button class="close">×</button><p class="eyebrow">PARENT CONTROLS</p><h2>Choose a play mode</h2><div class="modes"><button data-mode="drums" class="'+(mode==='drums'?'active':'')+'">🥁<span>Drum Party</span><small>Sounds + pictures</small></button><button data-mode="numbers" class="'+(mode==='numbers'?'active':'')+'">🔢<span>Numbers & Emoji</span><small>Colourful surprises</small></button></div><p class="parent-note">Gentle colours, no flashing, and one sound at a time.</p>';game.append(p);p.querySelector('.close').onclick=()=>p.remove();p.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;game.classList.toggle('numbers',mode==='numbers');document.querySelector('#mode-name').textContent=mode==='drums'?'DRUM PARTY':'NUMBERS & EMOJI';document.querySelector('#heading').textContent=mode==='drums'?'Tap, tap, boom!':'Count and sparkle!';document.querySelector('#instruction').textContent=mode==='drums'?'Press anything. Hold it for a drum roll!':'Press anything to make a happy surprise!';p.remove()})}
  </script>
</body>
</html>
